[changelog]
# Output file
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."""

body = """{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }}){% if commit.scope %} **{{ commit.scope }}**{% endif %}
{% endfor %}
{% endfor %}"""

footer = """

---

*Generated by [git-cliff](https://github.com/orhun/git-cliff)*"""

[git]
# Use conventional commits
conventional_commits = true
# Filter commits since last tag
filter_commits = true
# Include commits that don't follow conventional format
include_non_conventional = false

# Group by type
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance Improvements" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverts" },
]

# Protect against breaking changes
protect = { message = "^(feat|fix)(!?):.*BREAKING CHANGE" }

# Template for each commit
commit_template = "- {{ message }}{% if scope %} (**{{ scope }}**){% endif %} ({{ id | truncate(length=7, end=\"\") }})"

# Version sorting
version_sort = "semver"

# Ignore certain commits
ignore_commits = [
    "chore: bump version",
    "chore: release",
]

# Output as HTML (matching current format)
output_format = "html"

[html]
# Custom HTML template
header = """<div class="changelog">"""
body = """{% for group, commits in commits | group_by(attribute="group") %}
<h3>{{ group | upper_first }}</h3>
<ul>
{% for commit in commits %}
<li>{{ commit.message | upper_first }}{% if commit.scope %} <strong>{{ commit.scope }}</strong>{% endif %} ({{ commit.id | truncate(length=7, end="") }})</li>
{% endfor %}
</ul>
{% endfor %}"""
footer = """</div>"""